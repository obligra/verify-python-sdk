name: Publish Python SDK to PyPI

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Reviewed full main commit SHA to publish
        required: true
        type: string
      expected_version:
        description: Reviewed package version
        required: true
        default: "0.1.0"
        type: string

permissions: {}

concurrency:
  group: obligra-verify-pypi-publication
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check reviewed source, version and registry
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, re, subprocess, tomllib
          import urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          expected = os.environ["EXPECTED_COMMIT"]
          assert re.fullmatch(r"[0-9a-f]{40}", expected), "Expected a full commit SHA"
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert actual == expected, "Workflow source differs from approved commit"
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          assert project["name"] == "obligra-verify"
          assert project["version"] == os.environ["EXPECTED_VERSION"] == "0.1.0", "Only the reviewed initial release is permitted"
          # Runtime accepted by the one live Python Test capture on 2026-11-17.
          runtime = Path("src/obligra_verify/__init__.py").read_bytes()
          assert hashlib.sha256(runtime).hexdigest() == "fa6a86cee3860e22540f1a7f37946f3cd050ac9993e982b225fe7b1bca53eebf", "Runtime differs from accepted source"
          version = urllib.parse.quote(project["version"], safe="")
          try:
              with urllib.request.urlopen(f"https://pypi.org/pypi/obligra-verify/{version}/json", timeout=15) as response:
                  json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              raise SystemExit("This version already exists; inspect it instead of uploading again")
          PY
      - name: Install pinned packaging tools
        run: python -m pip install build==1.6.1 hatchling==1.33.0 twine==7.0.0
      - name: Build and validate distributions
        run: |
          python -m build --no-isolation
          python -m twine check --strict dist/*
      - name: Record distribution hashes for release approval
        run: |
          sha256sum dist/* > distribution-sha256.txt
          cat distribution-sha256.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Configure this environment with Steve's required review and main-only
    # deployment rules before enabling the matching PyPI Trusted Publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/obligra-verify/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish through the scoped PyPI Trusted Publisher
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          skip-existing: false

